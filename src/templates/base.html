<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#ffffff">
    <title>{% block title %}Правбюро{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('bounty_static', path='/app.css') }}">
  </head>
  <body>
    {% if preview_mode %}<div class="preview-banner">Режим предпросмотра · данные не изменяются</div>{% endif %}
    <header class="site-header">
      <a class="brand" href="/cabinet" aria-label="Правбюро — кабинет агента">
        <img class="brand-logo" src="{{ url_for('bounty_static', path='/img/logo.svg') }}" alt="Правбюро">
        <span class="brand-copy"><strong>Личный кабинет</strong><small>Управление выплатами</small></span>
      </a>
      <button class="menu-toggle" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="main-nav">☰</button>
      <nav class="main-nav" id="main-nav" aria-label="Основная навигация">
        <a href="/cabinet">Кабинет агента</a>
        <a href="/admin/rewards">Начисления</a>
        <a class="nav-cta" href="/profile">Профиль</a>
      </nav>
    </header>
    <main class="page-shell">{% block content %}{% endblock %}</main>
    <footer class="site-footer">
      <div class="footer-inner">
        <a class="brand footer-brand" href="/cabinet">
          <img class="brand-logo" src="{{ url_for('bounty_static', path='/img/logo.svg') }}" alt="Правбюро">
          <span class="brand-copy"><strong>Правбюро</strong><small>Агентская программа</small></span>
        </a>
        <nav class="footer-nav" aria-label="Навигация в подвале">
          <a href="/cabinet">Кабинет</a>
          <a href="/admin/rewards">Начисления</a>
          <a href="https://t.me/pravburo" target="_blank" rel="noopener">Telegram</a>
        </nav>
        <div class="footer-meta">ИП Свириденко С. В. · Правбюро</div>
      </div>
    </footer>
    <script src="{{ url_for('bounty_static', path='/app.js') }}" defer></script>
  </body>
</html>
